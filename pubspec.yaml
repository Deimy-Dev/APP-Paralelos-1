name: app1_paralelos
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.6
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1 
  image_picker: ^1.1.2
  firebase_app_check: ^0.3.2+6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg" 

